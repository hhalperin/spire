name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scan.py/deck.py claim to be pure-stdlib and portable; test the floor
        # (pyproject's target-version) and a current version, not just one.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest pyyaml ruff

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Test (pytest)
        # Includes tests/test_plugin_manifests.py, which validates plugin.json,
        # marketplace.json, and every SKILL.md's frontmatter — the structural
        # checks that `claude plugin validate` performs, runnable without the CLI.
        run: python -m pytest tests/ -q

  client:
    # The MCP server and the client it serves. Separate from `test` because the
    # Python engine must stay green on a machine with no Rust at all — that is
    # the whole point of the server owning no game state.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Every component draws no more rolls than it declares
        # content/scenes.json declares each component's roll cost and the engine
        # sizes every scene's vector from those numbers. Only JavaScript can
        # check them, because the truth is eighteen path builders — so this runs
        # them and fails if one ever outdraws its declaration. Under-declaring is
        # invisible by eye: the scene stays deterministic and quietly repeats.
        run: node tools/scenes.mjs --out /tmp/scenes.html

      - name: Bundle the client
        run: node tools/build-app.mjs

      - name: The bundle must not have grown a network dependency
        # The ui:// resource declares an empty CSP allowlist. That is only
        # honest if the document really is self-contained, so check it here
        # rather than discovering it in someone's Claude Desktop.
        run: |
          if grep -qE 'src="http|href="http|url\(http|fonts\.(googleapis|gstatic)|cdn\.' \
               server/assets/app.html; then
            echo "app.html references an external origin; the CSP allowlist is a lie."
            exit 1
          fi
          grep -q 'data:font/woff2;base64,' server/assets/app.html

      - name: The bundle must be committed in sync with app/
        # A stale server/assets/app.html means the binary serves one client while
        # the repo shows another.
        run: git diff --exit-code -- server/assets/app.html

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Test (cargo)
        run: cargo test --manifest-path server/Cargo.toml

      - name: Build the server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Protocol tests over real stdio
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_mcp_server.py -q

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Runs the same hooks defined in .pre-commit-config.yaml, so what's
      # documented for local use is also enforced in CI.
      - uses: pre-commit/action@v3.0.1

  plugin-validate:
    # Best-effort: exercises the real `claude plugin validate` CLI as a second
    # opinion alongside tests/test_plugin_manifests.py (the enforced, no-auth
    # equivalent). Skips itself when no API key secret is configured, and
    # never fails the build on its own.
    #
    # Note: the "skip if no secret" check happens INSIDE the step below, not
    # in a job-level `if:` — the `secrets` context is not permitted there
    # (GitHub Actions rejects the whole workflow file if it is).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping (optional job)."
            exit 0
          fi
          claude plugin validate .
