  <style>
/* The scene layer stack.
 *
 * Silhouette comes from app/scene.js as SVG; atmosphere lives here, because a
 * gradient needs no geometry and because this is where the theme tokens are. The
 * composer only tells this stylesheet where the light is — everything else is
 * derived, which is how both themes come free.
 *
 * This replaces `body::before`, which was the entire atmosphere layer before:
 * one facet-tinted radial. That pool survives as `.sc-glow`, so the screen still
 * has one warm source and DESIGN_SYSTEM's rule still holds.
 */

:root {
  /* The two poles every silhouette is mixed between. `--sc-form` is the
     direction "toward legibility", which is lighter on stone and darker on
     paper — so the composer never has to know which theme it is in. */
  --sc-void: var(--stone-900);
  --sc-form: #6f6255;

  --sc-tint: var(--steel);
  --sc-tint-pct: 10%;

  --sc-light-x: 50%;
  --sc-light-y: 4%;
  --sc-light-spread: 1;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --sc-form: #6b645c;
  }
}
:root[data-theme='light'] { --sc-form: #6b645c; }

/* ------------------------------------------------------------------ stack -- */

#scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  /* The biome tint is mixed into the ground once, here, so every layer above
     inherits a world rather than each one re-deriving it. */
  background: color-mix(in srgb, var(--sc-tint) var(--sc-tint-pct), var(--sc-void));
}

#scene > * {
  position: absolute;
  inset: 0;
}

.scene-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Atmosphere layers, in stack order. Each is a single element with no geometry;
   `has-*` classes come from the scene's declared layer list, so a scene that
   does not use a layer genuinely does not paint it. */

.sc-haze,
.sc-shaft,
.sc-glow,
.sc-vignette {
  display: none;
}

#scene.has-haze .sc-haze { display: block; }
#scene.has-shaft .sc-shaft { display: block; }
#scene.has-glow .sc-glow { display: block; }
#scene.has-vignette .sc-vignette { display: block; }

/* Fog between far and mid. Sits low and wide — its job is to detach the distance
   from the architecture, not to be visible in itself. */
.sc-haze {
  background: linear-gradient(
    180deg,
    transparent 28%,
    color-mix(in srgb, var(--sc-form) 5%, transparent) 52%,
    transparent 76%
  );
}

/* The one warm source, thrown from wherever the scene put it. Two cones rather
   than one so the light has a direction instead of being a blob. */
.sc-shaft {
  background:
    radial-gradient(
      calc(46% * var(--sc-light-spread)) calc(62% * var(--sc-light-spread))
      at var(--sc-light-x) var(--sc-light-y),
      color-mix(in srgb, var(--facet) 9%, transparent),
      transparent 70%
    );
  mix-blend-mode: screen;
}

:root[data-theme='light'] .sc-shaft,
:root:not([data-theme='dark']) .sc-shaft {
  /* Screen blending on paper turns the shaft into a white smear. On light the
     same light reads as a soft warm wash instead. */
  mix-blend-mode: multiply;
  background: radial-gradient(
    calc(46% * var(--sc-light-spread)) calc(62% * var(--sc-light-spread))
    at var(--sc-light-x) var(--sc-light-y),
    color-mix(in srgb, var(--facet) 7%, transparent),
    transparent 70%
  );
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .sc-shaft { mix-blend-mode: screen; }
}

/* The torch pool. This is the old body::before, kept. */
.sc-glow {
  background:
    radial-gradient(120% 70% at var(--sc-light-x) calc(var(--sc-light-y) - 12%),
      color-mix(in srgb, var(--facet) 20%, transparent), transparent 62%);
}

/* The frame. Pulls the corners down so the content column reads as lit. */
.sc-vignette {
  background:
    radial-gradient(120% 96% at 50% 42%, transparent 46%, rgba(0, 0, 0, .42) 100%),
    linear-gradient(180deg, transparent 62%, rgba(0, 0, 0, .34) 100%);
}

:root[data-theme='light'] .sc-vignette {
  background:
    radial-gradient(120% 96% at 50% 42%, transparent 52%, rgba(28, 25, 22, .12) 100%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) .sc-vignette {
    background:
      radial-gradient(120% 96% at 50% 42%, transparent 52%, rgba(28, 25, 22, .12) 100%);
  }
}

/* A scene change is a cut, not a crossfade — the facet tint already animates and
   two things easing at once reads as lag. The one transition here is the light
   moving, which sells the change of place. */
#scene { transition: background var(--t-slow) var(--ease); }
.sc-shaft, .sc-glow { transition: background var(--t-slow) var(--ease); }

@media (prefers-reduced-motion: reduce) {
  #scene, .sc-shaft, .sc-glow { transition: none; }
}

/* -------------------------------------------------------------- wireframe -- */

/* The labelled view, used by tools/scenes.mjs. It lives here rather than in the
   tool so that what the wireframe draws and what the composer draws are governed
   by one stylesheet — the whole point of the JSON being the source. */

#scene.wireframe { background: var(--sc-void); }
#scene.wireframe .scene-svg path { fill: none; stroke: var(--muted); stroke-width: 1.5; }

.sc-zone {
  position: absolute;
  border: 1px solid color-mix(in srgb, var(--facet) 70%, transparent);
  font: 10px/1.4 var(--font-mono, monospace);
  color: var(--facet);
  padding: 2px 4px;
}

/* The same 45-degree hatch the low-fi wireframes have used since the beginning
   (design/spire-ai/ui/wireframes/wireframe.css). Reused rather than reinvented so
   "this region is a placeholder" looks the same everywhere in the project. */
.sc-safe {
  position: absolute;
  border: 1px dashed var(--moss);
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 6px,
    color-mix(in srgb, var(--moss) 16%, transparent) 6px,
    color-mix(in srgb, var(--moss) 16%, transparent) 12px
  );
  font: 10px/1.4 var(--font-mono, monospace);
  color: var(--moss-text);
  padding: 2px 4px;
}

  <style>
/* Spire — the client stylesheet.
 *
 * Dark is the default here, which is a reversal. design/spire-ai/ui/DESIGN_SYSTEM.md
 * v0 committed to "ink on paper … not game-like", and that was a considered call
 * for a wireframe. It is the wrong call for a game. Slay the Spire is a torchlit
 * stone corridor with parchment in your hands, and reading as a dashboard is the
 * single fastest way to stop feeling like one. So: stone and ember by default,
 * the original paper palette kept intact as the light theme.
 *
 * What survives from v0 unchanged, because it was right:
 *   - one accent at a time (facet accent OR class accent, never both competing)
 *   - a motion budget of 2-3 beats per facet, and no continuous glow
 *   - silhouette before colour: every entity is identifiable in greyscale
 *   - Skip is never styled as the disabled option
 *
 * "Geometry over gradients" survives amended rather than intact: structure is
 * always geometry, and gradients carry depth and light only, never form. The
 * amendment is recorded in DESIGN_SYSTEM.md; scene.css is where it is spent.
 *
 * Theme resolution is three-state on purpose. An MCP App host sends
 * hostContext.theme, which lands on [data-theme]; with no host, prefers-color-scheme
 * decides; the dark palette is the bare :root default so a transparent container
 * can never leave us unpainted.
 */

/* ---------------------------------------------------------------- tokens -- */

:root {
  /* Stone: the spire itself. */
  --stone-900: #0b0908;
  --stone-800: #131010;
  --stone-700: #1b1715;
  --stone-600: #241f1a;
  --stone-500: #2f2822;
  --line: #3b322a;
  --line-soft: #2a231d;

  /* Parchment: anything you hold. */
  --parchment: #e7dbc0;
  --parchment-2: #d6c5a3;
  --parchment-ink: #221c14;

  --ink: #f2e9d8;
  --ink-soft: #cabda4;
  --muted: #8d8171;

  /* Ember is the torch. It is the one warm light in the room. */
  --ember: #d9832f;
  --ember-hot: #f2ac57;
  --gold: #d9b464;
  --blood: #cf5648;
  --moss: #74b183;
  --violet: #ab98d8;
  --steel: #83b3d2;

  /* Small text needs its own darker/lighter variant — the fill values measure
     between 2.7:1 and 3.9:1 at caption sizes and would fail AA on their own.
     v0 recorded this for paper; the same rule applies inverted on stone. */
  --moss-text: #93c9a0;
  --gold-text: #e6c884;
  --ember-text: #f0ac66;
  --blood-text: #e07f72;

  /* Facet accents — name the mode at a glance. */
  --facet-title: #d9b464;
  --facet-map: #83b3d2;
  --facet-intent: #d9832f;
  --facet-combat: #cf5648;
  --facet-reward: #74b183;
  --facet-campfire: #f2ac57;
  --facet-shop: #ab98d8;
  --facet-event: #8fb583;
  --facet-deck: #cabda4;
  --facet: var(--facet-map);

  /* Room types get their own scale. Nothing else may use these as a primary,
     and every use is paired with a glyph or a label — never colour alone. */
  --room-bug: #d76a5f;
  --room-feature: #83b3d2;
  --room-refactor: #ab98d8;
  --room-design: #9a9ad0;
  --room-docs: #8fb583;
  --room-infra: #d79a6a;
  --room-orient: #9a9084;

  --card-face: var(--parchment);
  --card-ink: var(--parchment-ink);
  --surface: var(--stone-700);
  --surface-2: var(--stone-600);
  --bg: var(--stone-900);

  --radius: 5px;
  --radius-lg: 11px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 2px 10px rgba(0, 0, 0, .35);
  --shadow-2: 0 8px 26px rgba(0, 0, 0, .55);
  --shadow-card: 0 12px 30px rgba(0, 0, 0, .6);
  --glow: 0 0 0 1px rgba(217, 131, 47, .35), 0 0 22px -6px rgba(217, 131, 47, .55);

  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-ui: ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;

  --t-fast: 150ms;
  --t-mid: 280ms;
  --t-slow: 420ms;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

/* The v0 paper palette, preserved. Every contrast decision recorded in
   DESIGN_SYSTEM.md still holds here, including campfire at #9c5527 (4.89:1)
   rather than the #a65d2e that measured 4.33:1 and was retired. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --stone-900: #f3efe6;
    --stone-800: #ece6da;
    --stone-700: #ebe4d8;
    --stone-600: #e2dacb;
    --stone-500: #d8cfbd;
    --line: #c9c1b4;
    --line-soft: #ddd5c6;

    --parchment: #fbf7ee;
    --parchment-2: #ece6da;
    --parchment-ink: #1c1916;

    --ink: #1c1916;
    --ink-soft: #2c2822;
    --muted: #6b645c;

    --ember: #9c5527;
    --ember-hot: #b4682f;
    --gold: #9a7b34;
    --blood: #8f2d2d;
    --moss: #2f5d3a;
    --violet: #5c4d7a;
    --steel: #3a5f7a;

    --moss-text: #1f4a2b;
    --gold-text: #6b5320;
    --ember-text: #7d4520;
    --blood-text: #7a2626;

    --facet-title: #9a7b34;
    --facet-map: #3a5f7a;
    --facet-intent: #8a4b2e;
    --facet-combat: #8f2d2d;
    --facet-reward: #2f5d3a;
    --facet-campfire: #9c5527;
    --facet-shop: #5c4d7a;
    --facet-event: #4a6741;
    --facet-deck: #1c1916;

    --room-bug: #8f2d2d;
    --room-feature: #3a5f7a;
    --room-refactor: #5c4d7a;
    --room-design: #4a4a6a;
    --room-docs: #4a6741;
    --room-infra: #8a4b2e;
    --room-orient: #6b645c;

    --shadow-1: 0 1px 2px rgba(28, 25, 22, .08), 0 2px 8px rgba(28, 25, 22, .06);
    --shadow-2: 0 6px 18px rgba(28, 25, 22, .14);
    --shadow-card: 0 10px 26px rgba(28, 25, 22, .22);
    --glow: 0 0 0 1px rgba(156, 85, 39, .3), 0 0 18px -8px rgba(156, 85, 39, .5);
  }
}

/* An explicit host or user choice wins over the media query in both directions. */
:root[data-theme='light'] {
  --stone-900: #f3efe6; --stone-800: #ece6da; --stone-700: #ebe4d8;
  --stone-600: #e2dacb; --stone-500: #d8cfbd; --line: #c9c1b4; --line-soft: #ddd5c6;
  --parchment: #fbf7ee; --parchment-2: #ece6da; --parchment-ink: #1c1916;
  --ink: #1c1916; --ink-soft: #2c2822; --muted: #6b645c;
  --ember: #9c5527; --ember-hot: #b4682f; --gold: #9a7b34; --blood: #8f2d2d;
  --moss: #2f5d3a; --violet: #5c4d7a; --steel: #3a5f7a;
  --moss-text: #1f4a2b; --gold-text: #6b5320; --ember-text: #7d4520; --blood-text: #7a2626;
  --facet-title: #9a7b34; --facet-map: #3a5f7a; --facet-intent: #8a4b2e;
  --facet-combat: #8f2d2d; --facet-reward: #2f5d3a; --facet-campfire: #9c5527;
  --facet-shop: #5c4d7a; --facet-event: #4a6741; --facet-deck: #1c1916;
  --room-bug: #8f2d2d; --room-feature: #3a5f7a; --room-refactor: #5c4d7a;
  --room-design: #4a4a6a; --room-docs: #4a6741; --room-infra: #8a4b2e; --room-orient: #6b645c;
  --shadow-1: 0 1px 2px rgba(28, 25, 22, .08), 0 2px 8px rgba(28, 25, 22, .06);
  --shadow-2: 0 6px 18px rgba(28, 25, 22, .14);
  --shadow-card: 0 10px 26px rgba(28, 25, 22, .22);
  --glow: 0 0 0 1px rgba(156, 85, 39, .3), 0 0 18px -8px rgba(156, 85, 39, .5);
}

:root[data-theme='dark'] { color-scheme: dark; }
:root[data-theme='light'] { color-scheme: light; }

/* ------------------------------------------------------------------ base -- */

* { box-sizing: border-box; }

/* [hidden] must beat any class that sets display, or a screen toggled off by
   the state machine stays on screen. */
[hidden] { display: none !important; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* The torchlight used to live here as body::before — one facet-tinted radial,
   the whole atmosphere the client had. It now lives in scene.css as `.sc-glow`,
   one layer of a nine-layer stack, so the warm pool can move with the scene
   instead of always coming from the top of the page. Same light, same rule:
   one warm source, no continuous glow. */

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--facet);
  outline-offset: 2px;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 16px 28px;
}

/* ---------------------------------------------------------------- chrome -- */

.topbar {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.wordmark {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: .16em;
  color: var(--ink);
}

.tagline { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.icon-btn {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink-soft);
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 5px 9px;
  transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.icon-btn:hover { border-color: var(--facet); color: var(--ink); }

/* The run line. Deck size lives here permanently: ENTITY_STANDARDS rule 3 says
   the count must be on screen during a run, because a deck cost you cannot see
   is a cost that never makes refusing feel like a win. */
.chrome {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 10px 0;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line-soft);
}

.chrome b { color: var(--ink); font-weight: 600; }

.chip {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid currentColor;
}

.chip.cls { color: var(--steel); }
.chip.cap-warn { color: var(--blood-text); border-color: var(--blood); }

.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pip {
  width: 11px; height: 11px; border-radius: 50%;
  border: 1.5px solid var(--ember);
  background: transparent;
}
.pip.on { background: var(--ember); box-shadow: 0 0 8px -2px var(--ember-hot); }

/* chrome.md: the banner is the single-task policy made visible. */
.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 9px 12px;
  border: 1px solid var(--blood);
  border-left-width: 4px;
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--blood) 12%, var(--surface));
  font-family: var(--font-ui);
  font-size: 12.5px;
}
.banner .dot { color: var(--blood-text); }
.banner .spacer { margin-left: auto; }

/* ---------------------------------------------------------------- screen -- */

.stage { min-height: 540px; padding-top: 16px; }

.screen { animation: screen-in var(--t-mid) var(--ease) both; }

.facet-tab {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .17em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 3px;
  background: var(--facet);
  color: var(--stone-900);
  margin-bottom: 12px;
}

.hero-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1.1;
  margin: 0 0 6px;
}

.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-1);
}

.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: 1.5fr 1fr; }
@media (max-width: 760px) { .cols-2 { grid-template-columns: 1fr; } }

/* CTAs. Solid is the one primary action a facet is allowed. */
.btn {
  font-family: var(--font-ui);
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: var(--radius);
  border: 1.5px solid var(--facet);
  background: var(--facet);
  color: var(--stone-900);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--facet); }
.btn.danger { background: transparent; color: var(--blood-text); border-color: var(--blood); }
.btn[aria-disabled='true'] { opacity: .4; pointer-events: none; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }

/* ------------------------------------------------------------------- map -- */

.map-wrap { position: relative; }

.map-canvas {
  position: relative;
  width: 100%;
  /* Floor 1 at the bottom, boss at the top. The original demo laid the graph out
     left-to-right, which reads as a flowchart; a spire is climbed. */
  height: calc(var(--floors, 16) * 46px);
  max-height: min(58vh, 520px);
  overflow-y: auto;
  scrollbar-width: thin;
  background:
    linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 30%),
    var(--stone-800);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  /* Per-axis, not the shorthand. `overflow: hidden` here would reset the
     overflow-y above and silently defeat the scroll-to-your-position code —
     the climb would render as a clipped column with no way to reach the rest. */
  overflow-x: hidden;
}

.map-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-edge { stroke: var(--line); stroke-width: 2; fill: none; opacity: .9; }
.map-edge.lit { stroke: var(--facet); stroke-width: 2.5; opacity: .9; }
.map-edge.open { stroke: var(--ember); stroke-width: 3.5; opacity: 1; }

.mnode {
  position: absolute;
  width: 26px; height: 26px;
  transform: translate(-50%, -50%);
  border: 2px solid var(--ink-soft);
  border-radius: 50%;
  background: var(--stone-600);
  /* Unreached nodes stay quiet but must remain readable — the route you are
     planning is made of them. Too faint and the map stops being a plan. */
  opacity: .62;
  padding: 0;
  transition: transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease);
}

/* Silhouette, not colour. No two node kinds may share a shape — that is why the
   merchant is a hexagon and the unknown owns the diamond. */
.mnode.k-elite { width: 32px; height: 32px; box-shadow: inset 0 0 0 3px var(--stone-800); }
.mnode.k-boss { width: 38px; height: 38px; border-width: 3px; }
.mnode.k-rest { border-radius: 8px; }
.mnode.k-treasure { border-radius: 3px; width: 22px; height: 22px; }
.mnode.k-shop { border-radius: 0; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.mnode.k-unknown { border-radius: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.mnode.k-event { border-radius: 0; clip-path: polygon(50% 8%, 92% 50%, 50% 92%, 8% 50%); border-style: dashed; }

.mnode .g {
  display: block;
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1;
  color: var(--ink);
}

.mnode.cleared { opacity: .4; border-color: var(--muted); }
.mnode.cleared .g { color: var(--muted); }
.mnode.legal {
  opacity: 1;
  border-color: var(--ember);
  box-shadow: var(--glow);
  cursor: pointer;
}
.mnode.legal:hover { transform: translate(-50%, -50%) scale(1.18); }
.mnode.current {
  opacity: 1;
  background: var(--ember);
  border-color: var(--ember-hot);
  transform: translate(-50%, -50%) scale(1.12);
}
.mnode.selected { box-shadow: 0 0 0 3px var(--facet); }

/* The annotation layer. Slay the Spire 2 shipped a draw tool for exactly this:
   marking a route before you commit to an edge. */
.mnode .mark {
  position: absolute;
  top: -9px; right: -9px;
  font-size: 11px;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6));
}

.you-are-here {
  position: absolute;
  transform: translate(-50%, 20px);
  font-family: var(--font-ui);
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--stone-900);
  background: var(--ember);
  padding: 1px 6px;
  border-radius: 999px;
  white-space: nowrap;
  pointer-events: none;
}

.map-legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  font-family: var(--font-ui); font-size: 11px; color: var(--muted);
  margin-top: 10px;
}

.marker-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.marker {
  width: 30px; height: 30px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 14px;
  line-height: 1;
  display: grid; place-items: center;
}
.marker[aria-pressed='true'] { border-color: var(--ember); box-shadow: var(--glow); }
.marker-hint { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }

/* ------------------------------------------------------------------ room -- */

.enemy {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}

.enemy-sil {
  flex: 0 0 auto;
  width: 62px; height: 62px;
  display: grid; place-items: center;
  border: 2px solid var(--room, var(--facet));
  border-radius: 50%;
  background: color-mix(in srgb, var(--room, var(--facet)) 16%, var(--surface));
  font-size: 24px;
}
.enemy-sil.elite { box-shadow: inset 0 0 0 4px var(--surface), 0 0 0 2px var(--room, var(--facet)); }
.enemy-sil.boss { width: 74px; height: 74px; border-width: 3px; }

.enemy-name { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0; }
.enemy-meta { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }

.room-chip {
  display: inline-block;
  font-family: var(--font-ui); font-size: 10.5px;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px;
  border: 1px solid currentColor;
}
.rt-bug { color: var(--room-bug); }
.rt-feature { color: var(--room-feature); }
.rt-refactor { color: var(--room-refactor); }
.rt-design { color: var(--room-design); }
.rt-docs { color: var(--room-docs); }
.rt-infra { color: var(--room-infra); }
.rt-orient { color: var(--room-orient); }

/* The intent bar. Icons are the Slay the Spire 2 vocabulary; the chip after each
   one names the deterministic sensor that produced it. Multiple intents sit side
   by side rather than stacking, which is what StS2 changed and it reads better. */
.intents { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }

.intent {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--tone, var(--facet-intent));
  border-radius: var(--radius);
  background: var(--surface-2);
  animation: intent-reveal 300ms var(--ease) both;
}
.intent .icon {
  font-size: 17px; line-height: 1;
  color: var(--tone, var(--facet-intent));
  min-width: 1.4em; text-align: center;
}
.intent .n {
  font-family: var(--font-mono); font-size: 15px; font-weight: 500;
  color: var(--tone, var(--facet-intent));
}
.intent .txt { font-size: 14px; }
.intent .sensor {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--muted); border: 1px solid var(--line);
  border-radius: 3px; padding: 1px 5px; margin-left: 4px;
}
.tone-danger { --tone: var(--blood-text); }
.tone-warn { --tone: var(--ember-text); }
.tone-safe { --tone: var(--moss-text); }
.tone-muted { --tone: var(--muted); }

/* No sensor, no intent. Saying so is honest disclosure; a hedge would not be. */
.no-intent {
  margin-top: 14px; padding: 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted); font-size: 13.5px;
}

.acceptance {
  margin-top: 14px;
  font-family: var(--font-mono); font-size: 12.5px;
  background: var(--stone-900); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px;
  overflow-x: auto;
}
:root[data-theme='light'] .acceptance,
.acceptance { --shadow: none; }
.acceptance .verdict { font-weight: 500; }
.acceptance .pass { color: var(--moss-text); }
.acceptance .fail { color: var(--blood-text); }
.acceptance .unknown { color: var(--muted); }

/* The progress meter. Deliberately NOT a health bar — it fills upward toward a
   target and resets with the room. The field is called clear_at in the data for
   the same reason. */
.meter-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.meter {
  position: relative; flex: 1;
  height: 12px; border-radius: 999px;
  background: var(--stone-900);
  border: 1px solid var(--line);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ember), var(--ember-hot));
  transition: width var(--t-slow) var(--ease);
}
.meter-label { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }

/* ------------------------------------------------------------------ hand -- */

.hand {
  display: flex; justify-content: center; align-items: flex-end;
  padding: 22px 0 6px; min-height: 210px;
  perspective: 1200px;
}

.card {
  position: relative;
  width: 148px; height: 196px;
  /* The fan only overlaps once there are enough cards to need it. With two in
     hand, overlapping just hid half of one card's text. */
  margin: 0 var(--overlap, 0px);
  border-radius: 9px;
  border: 1px solid var(--stone-900);
  background: linear-gradient(180deg, var(--parchment), var(--parchment-2));
  color: var(--card-ink);
  box-shadow: var(--shadow-card);
  padding: 15px 12px 12px;
  text-align: left;
  transform: rotate(var(--rot, 0deg)) translateY(var(--ty, 0px));
  transform-origin: 50% 130%;
  transition: transform var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease);
}
.card:hover, .card:focus-visible {
  transform: translateY(-30px) scale(1.07) rotate(0deg);
  z-index: 5;
  margin: 0 6px;
  box-shadow: 0 22px 44px rgba(0, 0, 0, .6);
}
.card[aria-disabled='true'] { filter: saturate(.35) brightness(.72); }
.card[aria-disabled='true']:hover { transform: rotate(var(--rot, 0deg)) translateY(-6px); }

/* The type band is the Slay the Spire read: attack / skill / power at a glance,
   before you have read a word of the card. */
.card .band {
  position: absolute; left: 0; right: 0; top: 0; height: 5px;
  border-radius: 9px 9px 0 0;
  background: var(--band, var(--muted));
}
.card.t-attack { --band: #b3402f; }
.card.t-skill { --band: #3f6f92; }
.card.t-power { --band: #7a5aa8; }

.card .cost {
  position: absolute; top: -12px; left: -12px;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 34% 30%, #4a4038, #16120f);
  border: 2px solid var(--ember);
  color: var(--ink);
  font-family: var(--font-mono); font-size: 15px; font-weight: 500;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .5);
}

.card .notch {
  position: absolute; top: 9px; right: 9px;
  width: 10px; height: 10px; transform: rotate(45deg);
  border: 1.5px solid var(--card-ink);
}
.card.r-uncommon .notch { background: #3f6f92; border-color: #3f6f92; }
.card.r-rare .notch { background: var(--gold); border-color: var(--gold); }

.card .title {
  display: block;
  font-family: var(--font-display); font-weight: 600;
  font-size: 15px; line-height: 1.16; margin: 10px 0 6px;
}
.card .body {
  display: block;
  font-size: 12.5px; line-height: 1.34;
  /* Card text is a fixed budget. Anything longer belongs on the hover preview,
     not spilling over the frame. */
  max-height: 88px; overflow: hidden;
}
.card .foot {
  position: absolute; left: 12px; right: 12px; bottom: 10px;
  font-family: var(--font-ui); font-size: 10px; color: #5f5443;
  display: flex; justify-content: space-between; gap: 6px;
}
.card .key {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 10px; color: #6b5f4d;
  border: 1px solid #b9a887; border-radius: 3px; padding: 0 5px;
  line-height: 1.5;
}

/* Cards that are legal but unaffordable, or illegal here, sit on a bench.
   Deliberately not card-shaped, so nobody mistakes them for something playable —
   but visible, because knowing what you are missing is part of solving a turn. */
.bench {
  display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
}
.bench-chip {
  font-family: var(--font-ui); font-size: 11.5px;
  color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; background: var(--surface-2);
}

/* ---------------------------------------------------------------- reward -- */

/* reward.md inverts normal upgrade-shop UI on purpose: Skip owns the hero
   region, is focused on entry, and is never styled as the disabled option. */
.skip-hero {
  display: block; width: 100%;
  border: 2px solid var(--moss);
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--moss) 14%, var(--surface));
  padding: 22px 20px;
  text-align: left;
}
.skip-hero:hover { box-shadow: var(--shadow-2); }
.skip-kicker {
  font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--moss-text);
}
.skip-main { font-family: var(--font-display); font-size: 29px; font-weight: 700; margin: 4px 0 8px; }
.skip-payout {
  display: inline-block; font-family: var(--font-ui); font-size: 12px; font-weight: 600;
  background: var(--moss); color: var(--stone-900);
  border-radius: 999px; padding: 3px 11px;
}
.offers { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
.offers .card { margin: 0; transform: none; }
.offers .card:hover, .offers .card:focus-visible { transform: translateY(-8px) scale(1.03); }
.offers-label {
  font-family: var(--font-ui); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); margin-top: 22px;
}

/* -------------------------------------------------------- lists & shelves -- */

.shelf { display: flex; flex-wrap: wrap; gap: 10px; }

.entity {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); padding: 9px 12px;
  font-size: 13.5px;
}
.sil { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; }

/* One silhouette per object kind, per ENTITY_STANDARDS. Greyscale-legible. */
.sil.relic { border: 3px solid var(--gold); border-radius: 50%; }
.sil.power { background: var(--facet-campfire); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); }
.sil.potion { background: var(--steel); clip-path: polygon(12% 0, 88% 0, 62% 46%, 62% 100%, 38% 100%, 38% 46%); }
.sil.curse { border: 2px dashed var(--blood); clip-path: polygon(0 0, 100% 0, 100% 88%, 92% 100%, 0 100%); }
.sil.card-sil { border: 2px solid var(--ink-soft); border-radius: 3px; width: 19px; height: 26px; }

.entity .nm { font-weight: 500; }
.entity .dt { color: var(--muted); font-size: 12.5px; }

.badge {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid var(--gold); border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--gold) 10%, var(--surface));
  padding: 14px 16px;
}
.badge .star { color: var(--gold); font-size: 20px; line-height: 1; }
.badge .nm { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.badge .bl { color: var(--ink-soft); font-size: 13.5px; }

.log {
  margin-top: 16px; font-family: var(--font-mono); font-size: 12px;
  color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 10px;
}
.log div { padding: 2px 0; }

.choice {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); padding: 12px 14px; margin-bottom: 9px;
}
.choice:hover { border-color: var(--facet); }
.choice.greedy { border-color: var(--blood); }
.choice .lb { font-weight: 600; }
.choice .cq { color: var(--muted); font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--stone-900); color: var(--ink);
  border: 1px solid var(--ember); border-radius: 999px;
  padding: 8px 18px; font-family: var(--font-ui); font-size: 13px;
  box-shadow: var(--shadow-2); z-index: 50;
}

/* Room clear gets one beat, and it is distinct from fleeing. */
.fanfare {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: rgba(0, 0, 0, .55); z-index: 60; pointer-events: none;
}
.fanfare .stamp {
  font-family: var(--font-display); font-weight: 700; font-size: 52px;
  letter-spacing: .06em; color: var(--ember-hot);
  text-shadow: 0 4px 30px rgba(0, 0, 0, .8);
  animation: stamp 640ms var(--ease) both;
}

.status {
  font-family: var(--font-ui); font-size: 11.5px; color: var(--muted);
  margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line-soft);
  display: flex; gap: 14px; flex-wrap: wrap;
}
.status .dot-on { color: var(--moss-text); }
.status .dot-off { color: var(--muted); }

.kbd {
  font-family: var(--font-mono); font-size: 10.5px;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 3px; padding: 0 4px; color: var(--ink-soft);
}

/* -------------------------------------------------------------- keyframes -- */

@keyframes screen-in {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}
@keyframes intent-reveal {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: none; }
}
@keyframes card-commit {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  55% { transform: translateY(-90px) scale(1.05); opacity: 1; }
  100% { transform: translateY(-150px) scale(.9); opacity: 0; }
}
@keyframes stamp {
  0% { opacity: 0; transform: scale(1.5) rotate(-6deg); }
  40% { opacity: 1; transform: scale(1) rotate(-3deg); }
  100% { opacity: 0; transform: scale(1.02) rotate(-3deg); }
}

.committing { animation: card-commit 380ms var(--ease) both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .card:hover, .card:focus-visible { transform: none; }
  .mnode.legal:hover { transform: translate(-50%, -50%); }
}

@media (max-width: 620px) {
  .wordmark { font-size: 17px; }
  .tagline { display: none; }
  .card { width: 124px; height: 172px; }
  .hero-title { font-size: 27px; }
  .skip-main { font-size: 24px; }
}

  </style>
</head>

  <div id="scene" aria-hidden="true">
    <div class="sc-haze"></div>
    <div class="sc-shaft"></div>
    <div class="sc-glow"></div>
    <div class="sc-vignette"></div>
  </div>

  <div class="shell">

      <span class="wordmark">SPIRE</span>
      <span class="tagline">one room at a time</span>

    <div class="banner" id="banner" role="status" hidden></div>

/* ---- bridge.js ---- */
/* The MCP Apps bridge.
 *
 * Hand-written against the postMessage protocol in the MCP Apps specification
 * (2026-01-26) rather than taking @modelcontextprotocol/ext-apps. The spec is
 * explicit that the SDK is a convenience and not a requirement, and a hand-rolled
 * bridge is what lets the whole client stay a single dependency-free HTML file —
 * which is also what lets the CSP declare no external origins at all.
 *
 * Sequence:
 *   app  -> host   ui/initialize                  (request)
 *   host -> app    result { hostContext, ... }
 *   app  -> host   ui/notifications/initialized   (notification)
 *   app  -> host   tools/call                     (request, any time after)
 *   host -> app    ui/notifications/tool-result   (pushed, unprompted)
 *
 * Standalone mode matters as much as hosted mode. Opened directly in a browser
 * there is no parent to talk to, so the bridge resolves `connect()` against a
 * local adapter instead. That is how tools/host and the screenshot harness drive
 * the real client rather than a mock of it.
 */

const PROTOCOL_VERSION = '2026-01-26';

const RPC = '2.0';

class Bridge {
  constructor(options = {}) {
    this.name = options.name || 'Spire';
    this.version = options.version || '0.3.0';
    this.pending = new Map();
    this.nextId = 1;
    this.hostContext = null;
    this.hostCapabilities = null;
    this.connected = false;
    this.hosted = typeof window !== 'undefined' && window.parent && window.parent !== window;

    /* Consumers assign these. */
    this.ontoolresult = null;
    this.ontoolinput = null;
    this.oncontextchange = null;
    this.onteardown = null;

    /* Standalone escape hatch: a function (name, args) -> Promise<CallToolResult>. */
    this.localAdapter = options.localAdapter || null;

    this._onMessage = this._onMessage.bind(this);
    if (typeof window !== 'undefined') window.addEventListener('message', this._onMessage);
  }

  /* ------------------------------------------------------------ outbound -- */

  _post(payload) {
    if (!this.hosted) return;
    window.parent.postMessage(payload, '*');
  }

  _request(method, params) {
    if (!this.hosted) return Promise.reject(new Error('not hosted'));
    const id = this.nextId++;
    const promise = new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      // A host that never answers must not hang the UI forever.
      setTimeout(() => {
        if (this.pending.has(id)) {
          this.pending.delete(id);
          reject(new Error(`${method} timed out`));
        }
      }, 30000);
    });
    this._post({ jsonrpc: RPC, id, method, params });
    return promise;
  }

  _notify(method, params) {
    this._post({ jsonrpc: RPC, method, params });
  }

  /* ------------------------------------------------------------- inbound -- */

  _onMessage(event) {
    const msg = event && event.data;
    if (!msg || msg.jsonrpc !== RPC) return;

    if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
      const waiting = this.pending.get(msg.id);
      if (!waiting) return;
      this.pending.delete(msg.id);
      if (msg.error) waiting.reject(new Error(msg.error.message || 'host error'));
      else waiting.resolve(msg.result);
      return;
    }

    switch (msg.method) {
      case 'ui/notifications/tool-result':
        if (this.ontoolresult) this.ontoolresult(msg.params);
        break;
      case 'ui/notifications/tool-input':
        if (this.ontoolinput) this.ontoolinput(msg.params);
        break;
      case 'ui/notifications/host-context-changed':
        this.hostContext = Object.assign({}, this.hostContext, msg.params);
        if (this.oncontextchange) this.oncontextchange(this.hostContext);
        break;
      case 'ui/resource-teardown':
        if (this.onteardown) this.onteardown(msg.params);
        break;
      default:
        break;
    }
  }

  /* ---------------------------------------------------------- public API -- */

  async connect() {
    if (!this.hosted) {
      this.connected = true;
      this.hostContext = { theme: null, displayMode: 'standalone' };
      return this.hostContext;
    }
    try {
      const result = await this._request('ui/initialize', {
        protocolVersion: PROTOCOL_VERSION,
        capabilities: {},
        clientInfo: { name: this.name, version: this.version },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
      });
      this.hostCapabilities = (result && result.hostCapabilities) || {};
      this.hostContext = (result && result.hostContext) || {};
      this.connected = true;
      this._notify('ui/notifications/initialized', {});
      return this.hostContext;
    } catch (err) {
      // A host that does not speak the extension is not a crash: fall back to
      // standalone and keep rendering. Failing open is the house rule.
      this.hosted = false;
      this.connected = true;
      this.hostContext = { theme: null, displayMode: 'standalone', error: String(err) };
      return this.hostContext;
    }
  }

  async callServerTool(name, args) {
    if (!this.hosted) {
      if (!this.localAdapter) throw new Error('no host and no local adapter');
      return this.localAdapter(name, args || {});
    }
    return this._request('tools/call', { name, arguments: args || {} });
  }

  requestDisplayMode(mode) {
    if (this.hosted) this._notify('ui/request-display-mode', { mode });
  }

  /* Tell the host how tall we actually are, so the iframe stops guessing. */
  reportSize() {
    if (!this.hosted || typeof document === 'undefined') return;
    const el = document.documentElement;
    this._notify('ui/notifications/size-changed', {
      width: el.scrollWidth,
      height: Math.max(el.scrollHeight, document.body ? document.body.scrollHeight : 0),
    });
  }

  observeSize() {
    if (!this.hosted || typeof ResizeObserver === 'undefined') return;
    let queued = false;
    const observer = new ResizeObserver(() => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        this.reportSize();
      });
    });
    observer.observe(document.body);
  }

  /* Hand the model a one-line summary of what the player just did, so the
     conversation stays in sync with a UI it cannot see. */
  updateModelContext(text, structured) {
    if (!this.hosted) return;
    this._notify('ui/update-model-context', {
      content: [{ type: 'text', text }],
      structuredContent: structured || undefined,
    });
  }

  sendMessage(text) {
    if (this.hosted) this._notify('ui/message', { role: 'user', content: { type: 'text', text } });
  }
}

/* Pull the payload out of a CallToolResult. structuredContent is what the client
   renders; the text block is for hosts with no view. */
function unwrap(result) {
  if (!result) return null;
  if (result.structuredContent !== undefined) return result.structuredContent;
  const block = (result.content || []).find((c) => c.type === 'text');
  if (!block) return null;
  try {
    return JSON.parse(block.text);
  } catch (_) {
    return null;
  }
}


/* ---- scene.js ---- */
/* The scene composer.
 *
 * Reads `content/scenes.json` — inlined at build time by tools/build-app.mjs —
 * and builds a background out of modular silhouette parts. The JSON is not a
 * description of the backgrounds; it is their source, and tools/scenes.mjs draws
 * its labelled wireframe from the same object, so the spec cannot drift.
 *
 * Two things are worth understanding before changing anything here.
 *
 * **There is no RNG.** `scripts/mapgen.py` established the pattern with
 * `unknown_rolls`: the engine pre-rolls a fixed float vector, ships it in the
 * payload, and the client applies shared thresholds. So this file is a pure
 * function from (scene, biome, rolls) to SVG — same inputs, same picture, every
 * time, on any machine. Re-entering a floor looks identical because it *is*
 * identical, not because something was cached.
 *
 * **Legibility is bought with contrast, not geometry.** The content column
 * covers most of the frame, so there is nowhere to draw "around" the text. Each
 * layer instead declares how far it may step from the void, and any shape whose
 * box crosses a safe rectangle has that step attenuated. The result is bold
 * framing at the edges and a whisper behind the paragraphs — which is what a
 * background is supposed to do anyway.
 */

const SVG_NS = 'http://www.w3.org/2000/svg';

/* The frame every scene is composed in. Normalised coordinates from the JSON are
   multiplied up into this box; the SVG then scales to whatever the viewport is,
   so a scene is resolution-independent and never needs a resize handler. */
const W = 1000;
const H = 700;

/* ------------------------------------------------------------------ rolls -- */

/* A cursor over the engine's float vector.
 *
 * Each grammar entry consumes a FIXED slice — `2 + 3 * count_max` — whether or
 * not it uses all of it. That is deliberate: if entries consumed only what they
 * needed, adding one pillar to a scene would shift the dice of every entry after
 * it and silently redraw the whole background. content/scenes.json states the
 * same formula, and tests/test_scenes.py holds both to it. */
class Rolls {
  constructor(values) {
    this.values = (values && values.length) ? values : [0.5];
    this.i = 0;
  }

  take() {
    const value = this.values[this.i % this.values.length];
    this.i += 1;
    return value;
  }

  /* Skip to the end of this entry's slice, so the next entry starts where the
     contract says it does regardless of what this one used. */
  advanceTo(mark) {
    this.i = mark;
  }

  between(low, high) {
    return low + this.take() * (high - low);
  }

  intBetween(low, high) {
    if (high <= low) return low;
    return Math.min(high, low + Math.floor(this.take() * (high - low + 1)));
  }

  pick(list) {
    if (!list || !list.length) return null;
    return list[Math.min(list.length - 1, Math.floor(this.take() * list.length))];
  }
}

/* ------------------------------------------------------------------ paint -- */

/* How far a shape may step away from the void, given its layer and where it sits.
 *
 * `--sc-void` and `--sc-form` are defined per theme in scene.css, so the step is
 * always *toward* legibility: lighter than near-black on stone, darker than
 * paper on the light theme. The composer never names a colour. */
function fillFor(layerDelta, behindText) {
  // Continuous, not binary. A shape half behind the content column should be
  // half-quieted; an earlier binary version muted anything that touched a safe
  // area, which flattened every wing pillar in the game and made the interiors
  // read as flat washes.
  const quiet = 1 - behindText * (1 - SCENES.contrast.safe_attenuation);
  const pct = Math.round(layerDelta * quiet * 100);
  return `color-mix(in srgb, var(--sc-form) ${pct}%, var(--sc-void))`;
}

/** How much of this shape sits behind text, 0..1. */
function behindTextFraction(box, safeRects) {
  let covered = 0;
  safeRects.forEach((safe) => {
    const x = Math.max(0, Math.min(box.x + box.w, safe.x + safe.w) - Math.max(box.x, safe.x));
    const y = Math.max(0, Math.min(box.y + box.h, safe.y + safe.h) - Math.max(box.y, safe.y));
    covered = Math.max(covered, (x * y) / (box.w * box.h));
  });
  return Math.min(1, covered);
}

/* ------------------------------------------------------- component library -- */

/* Every builder is a pure function of (box, rolls, biome) returning SVG path
   data in frame coordinates. `box` is the zone, already scaled up from the
   normalised rectangle. Shapes are drawn deliberately coarse — a silhouette that
   survives `filter: grayscale(1)` is one made of large, distinguishable masses,
   not of detail. */

const rect = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;

function crag(box, rolls) {
  const peaks = rolls.intBetween(3, 6);
  const base = box.y + box.h;
  let d = `M${box.x} ${base}`;
  for (let i = 0; i <= peaks; i += 1) {
    const x = box.x + (box.w * i) / peaks;
    const dip = rolls.between(0.25, 1);
    d += `L${x.toFixed(1)} ${(base - box.h * dip).toFixed(1)}`;
    if (i < peaks) {
      const mid = box.x + (box.w * (i + 0.5)) / peaks;
      d += `L${mid.toFixed(1)} ${(base - box.h * rolls.between(0.05, 0.5)).toFixed(1)}`;
    }
  }
  return `${d}L${box.x + box.w} ${base}Z`;
}

function tower(box, rolls) {
  const base = box.y + box.h;
  const taper = rolls.between(0.28, 0.46);
  const left = box.x + box.w * taper * 0.5;
  const right = box.x + box.w - box.w * taper * 0.5;
  const tiers = rolls.intBetween(2, 4);
  let d = `M${box.x} ${base}L${box.x} ${(box.y + box.h * 0.55).toFixed(1)}`;
  for (let i = 0; i < tiers; i += 1) {
    const t = (i + 1) / tiers;
    const y = box.y + box.h * 0.55 * (1 - t);
    const inset = box.w * 0.06 * t;
    d += `L${(box.x + inset).toFixed(1)} ${y.toFixed(1)}`;
  }
  d += `L${left.toFixed(1)} ${box.y.toFixed(1)}L${right.toFixed(1)} ${box.y.toFixed(1)}`;
  for (let i = tiers - 1; i >= 0; i -= 1) {
    const t = (i + 1) / tiers;
    const y = box.y + box.h * 0.55 * (1 - t);
    const inset = box.w * 0.06 * t;
    d += `L${(box.x + box.w - inset).toFixed(1)} ${y.toFixed(1)}`;
  }
  return `${d}L${box.x + box.w} ${(box.y + box.h * 0.55).toFixed(1)}L${box.x + box.w} ${base}Z`;
}

function skyline(box, rolls) {
  const steps = rolls.intBetween(5, 8);
  const base = box.y + box.h;
  let d = `M${box.x} ${base}`;
  let x = box.x;
  for (let i = 0; i < steps; i += 1) {
    const w = box.w / steps;
    const h = box.h * rolls.between(0.15, 0.72);
    d += `L${x.toFixed(1)} ${(base - h).toFixed(1)}L${(x + w).toFixed(1)} ${(base - h).toFixed(1)}`;
    x += w;
  }
  return `${d}L${box.x + box.w} ${base}Z`;
}

function pillar(box, rolls, biome) {
  const variant = rolls.pick(biome.pillar) || 'round';
  const w = box.w * rolls.between(0.34, 0.62);
  const x = box.x + (box.w - w) * rolls.between(0.1, 0.9);
  const base = box.y + box.h;
  const capH = box.h * 0.06;

  if (variant === 'broken') {
    const stop = box.y + box.h * rolls.between(0.3, 0.62);
    return `M${x.toFixed(1)} ${base}L${x.toFixed(1)} ${stop.toFixed(1)}`
      + `L${(x + w * 0.55).toFixed(1)} ${(stop + capH * 1.4).toFixed(1)}`
      + `L${(x + w).toFixed(1)} ${(stop - capH * 0.6).toFixed(1)}`
      + `L${(x + w).toFixed(1)} ${base}Z`;
  }

  const shaftInset = variant === 'fluted' ? w * 0.12 : w * 0.06;
  return `M${(x - w * 0.1).toFixed(1)} ${base}`
    + `L${(x - w * 0.1).toFixed(1)} ${(base - capH).toFixed(1)}`
    + `L${(x + shaftInset).toFixed(1)} ${(base - capH * 2).toFixed(1)}`
    + `L${(x + shaftInset).toFixed(1)} ${(box.y + capH * 2).toFixed(1)}`
    + `L${(x - w * 0.1).toFixed(1)} ${(box.y + capH).toFixed(1)}`
    + `L${(x - w * 0.1).toFixed(1)} ${box.y.toFixed(1)}`
    + `L${(x + w * 1.1).toFixed(1)} ${box.y.toFixed(1)}`
    + `L${(x + w * 1.1).toFixed(1)} ${(box.y + capH).toFixed(1)}`
    + `L${(x + w - shaftInset).toFixed(1)} ${(box.y + capH * 2).toFixed(1)}`
    + `L${(x + w - shaftInset).toFixed(1)} ${(base - capH * 2).toFixed(1)}`
    + `L${(x + w * 1.1).toFixed(1)} ${(base - capH).toFixed(1)}`
    + `L${(x + w * 1.1).toFixed(1)} ${base}Z`;
}

/* An arch is drawn as the WALL around the opening, not the opening itself —
   that is what makes it read as something you are standing inside rather than a
   croquet hoop floating in the dark. */
function arch(box, rolls, biome) {
  const style = biome.arch;
  const span = box.w * rolls.between(0.44, 0.72);
  const cx = box.x + box.w / 2 + (box.w - span) * (rolls.take() - 0.5) * 0.4;
  const left = cx - span / 2;
  const right = cx + span / 2;
  const base = box.y + box.h;
  const spring = box.y + box.h * rolls.between(0.42, 0.62);

  let opening;
  if (style === 'pointed') {
    const apex = box.y + box.h * 0.06;
    opening = `M${left.toFixed(1)} ${base}L${left.toFixed(1)} ${spring.toFixed(1)}`
      + `Q${left.toFixed(1)} ${apex.toFixed(1)} ${cx.toFixed(1)} ${apex.toFixed(1)}`
      + `Q${right.toFixed(1)} ${apex.toFixed(1)} ${right.toFixed(1)} ${spring.toFixed(1)}`
      + `L${right.toFixed(1)} ${base}Z`;
  } else if (style === 'broken') {
    const apex = box.y + box.h * rolls.between(0.1, 0.24);
    opening = `M${left.toFixed(1)} ${base}L${left.toFixed(1)} ${spring.toFixed(1)}`
      + `L${(cx - span * 0.18).toFixed(1)} ${apex.toFixed(1)}`
      + `L${(cx + span * 0.1).toFixed(1)} ${(apex + box.h * 0.08).toFixed(1)}`
      + `L${right.toFixed(1)} ${spring.toFixed(1)}L${right.toFixed(1)} ${base}Z`;
  } else {
    opening = `M${left.toFixed(1)} ${base}L${left.toFixed(1)} ${spring.toFixed(1)}`
      + `A${(span / 2).toFixed(1)} ${(span / 2).toFixed(1)} 0 0 1 ${right.toFixed(1)} ${spring.toFixed(1)}`
      + `L${right.toFixed(1)} ${base}Z`;
  }
  // Outer wall first, opening second: with fill-rule evenodd the second subpath
  // punches a hole, which is the whole trick.
  return `${rect(box.x, box.y, box.w, box.h)}${opening}`;
}

function windowShape(box, rolls, biome) {
  const w = box.w * rolls.between(0.1, 0.2);
  const h = box.h * rolls.between(0.16, 0.34);
  const x = box.x + (box.w - w) * rolls.take();
  const y = box.y + (box.h - h) * rolls.between(0.1, 0.7);
  if (biome.arch === 'round') {
    return `M${x.toFixed(1)} ${(y + h).toFixed(1)}L${x.toFixed(1)} ${(y + w / 2).toFixed(1)}`
      + `A${(w / 2).toFixed(1)} ${(w / 2).toFixed(1)} 0 0 1 ${(x + w).toFixed(1)} ${(y + w / 2).toFixed(1)}`
      + `L${(x + w).toFixed(1)} ${(y + h).toFixed(1)}Z`;
  }
  return rect(x, y, w, h);
}

function wall(box, rolls) {
  const courses = rolls.intBetween(4, 7);
  const top = box.y + box.h * rolls.between(0.0, 0.14);
  let d = rect(box.x, top, box.w, box.y + box.h - top);
  // Mortar lines read as thin gaps punched out of the mass.
  const step = (box.y + box.h - top) / courses;
  for (let i = 1; i < courses; i += 1) {
    const y = top + step * i;
    d += rect(box.x, y, box.w, Math.max(1.5, step * 0.06));
  }
  return d;
}

function stair(box, rolls) {
  const steps = rolls.intBetween(4, 7);
  const base = box.y + box.h;
  let d = `M${box.x} ${base}`;
  for (let i = 0; i < steps; i += 1) {
    const x = box.x + (box.w * i) / steps;
    const y = base - (box.h * (i + 1)) / steps;
    d += `L${x.toFixed(1)} ${y.toFixed(1)}L${(box.x + (box.w * (i + 1)) / steps).toFixed(1)} ${y.toFixed(1)}`;
  }
  return `${d}L${box.x + box.w} ${base}Z`;
}

function gate(box, rolls, biome) {
  const w = box.w * rolls.between(0.3, 0.44);
  const x = box.x + (box.w - w) / 2;
  const base = box.y + box.h;
  const lintel = box.y + box.h * 0.18;
  let d = rect(x - w * 0.14, lintel - box.h * 0.1, w * 1.28, box.h * 0.1);
  d += rect(x, lintel, w, base - lintel);
  if (biome.arch !== 'broken') {
    // A seam down the middle, so it reads as two leaves rather than a slab.
    d += rect(x + w / 2 - 1.5, lintel, 3, base - lintel);
  }
  return d;
}

function brazier(box, rolls) {
  const base = box.y + box.h;
  const w = box.w * 0.6;
  const x = box.x + (box.w - w) / 2;
  const bowlY = box.y + box.h * 0.42;
  return `M${(x + w * 0.32).toFixed(1)} ${base}L${(x + w * 0.42).toFixed(1)} ${(bowlY + box.h * 0.18).toFixed(1)}`
    + `L${(x + w * 0.58).toFixed(1)} ${(bowlY + box.h * 0.18).toFixed(1)}L${(x + w * 0.68).toFixed(1)} ${base}Z`
    + `M${x.toFixed(1)} ${bowlY.toFixed(1)}L${(x + w).toFixed(1)} ${bowlY.toFixed(1)}`
    + `L${(x + w * 0.78).toFixed(1)} ${(bowlY + box.h * 0.2).toFixed(1)}`
    + `L${(x + w * 0.22).toFixed(1)} ${(bowlY + box.h * 0.2).toFixed(1)}Z`
    + rect(x - w * 0.2, base - 4, w * 1.4, 4);
}

function stall(box, rolls) {
  const scallops = rolls.intBetween(4, 7);
  const hem = box.y + box.h * rolls.between(0.5, 0.8);
  let d = `M${box.x} ${box.y}L${box.x + box.w} ${box.y}L${box.x + box.w} ${hem.toFixed(1)}`;
  for (let i = scallops; i > 0; i -= 1) {
    const x0 = box.x + (box.w * i) / scallops;
    const x1 = box.x + (box.w * (i - 1)) / scallops;
    const mid = (x0 + x1) / 2;
    d += `Q${mid.toFixed(1)} ${(hem + box.h * 0.22).toFixed(1)} ${x1.toFixed(1)} ${hem.toFixed(1)}`;
  }
  return `${d}Z`;
}

function chest(box, rolls) {
  const base = box.y + box.h;
  const w = box.w * 0.66;
  const x = box.x + (box.w - w) / 2;
  const lid = box.y + box.h * 0.44;
  return rect(x - w * 0.2, base - box.h * 0.12, w * 1.4, box.h * 0.12)
    + rect(x, lid, w, base - lid - box.h * 0.12)
    + `M${x.toFixed(1)} ${lid.toFixed(1)}A${(w / 2).toFixed(1)} ${(box.h * 0.22).toFixed(1)} 0 0 1 ${(x + w).toFixed(1)} ${lid.toFixed(1)}Z`;
}

function pillarEdge(box, rolls) {
  const fromLeft = box.x < 0.5 * W;
  const w = box.w * rolls.between(0.5, 0.85);
  const x = fromLeft ? box.x : box.x + box.w - w;
  return rect(x, box.y, w, box.h);
}

function chain(box, rolls) {
  const x = box.x + box.w * rolls.take();
  const len = box.h * rolls.between(0.3, 0.8);
  const links = Math.max(3, Math.round(len / 26));
  let d = rect(x - 1.5, box.y, 3, len);
  for (let i = 0; i < links; i += 1) {
    const y = box.y + (len * i) / links;
    d += rect(x - 5, y, 10, 5);
  }
  return d;
}

function banner(box, rolls) {
  const w = box.w * rolls.between(0.3, 0.55);
  const x = box.x + (box.w - w) * rolls.take();
  const len = box.h * rolls.between(0.35, 0.7);
  const notch = len * 0.12;
  return `M${x.toFixed(1)} ${box.y}L${(x + w).toFixed(1)} ${box.y}`
    + `L${(x + w).toFixed(1)} ${(box.y + len).toFixed(1)}`
    + `L${(x + w / 2).toFixed(1)} ${(box.y + len - notch).toFixed(1)}`
    + `L${x.toFixed(1)} ${(box.y + len).toFixed(1)}Z`;
}

function root(box, rolls) {
  const fromLeft = box.x < 0.5 * W;
  const y0 = box.y + box.h * rolls.between(0.1, 0.6);
  const reach = box.w * rolls.between(0.6, 1.1);
  const x0 = fromLeft ? box.x : box.x + box.w;
  const dir = fromLeft ? 1 : -1;
  const sag = box.h * rolls.between(0.1, 0.3);
  const thick = Math.max(3, box.w * 0.06);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}`
    + `Q${(x0 + dir * reach * 0.5).toFixed(1)} ${(y0 + sag).toFixed(1)} `
    + `${(x0 + dir * reach).toFixed(1)} ${(y0 + sag * 1.6).toFixed(1)}`
    + `L${(x0 + dir * reach).toFixed(1)} ${(y0 + sag * 1.6 + thick).toFixed(1)}`
    + `Q${(x0 + dir * reach * 0.5).toFixed(1)} ${(y0 + sag + thick).toFixed(1)} `
    + `${x0.toFixed(1)} ${(y0 + thick).toFixed(1)}Z`;
}

function rubble(box, rolls) {
  const chunks = rolls.intBetween(3, 6);
  const base = box.y + box.h;
  let d = '';
  for (let i = 0; i < chunks; i += 1) {
    const w = box.w * rolls.between(0.02, 0.06);
    const h = w * rolls.between(0.4, 1.1);
    const x = box.x + box.w * rolls.take();
    d += `M${x.toFixed(1)} ${base}L${(x + w * 0.3).toFixed(1)} ${(base - h).toFixed(1)}`
      + `L${(x + w).toFixed(1)} ${(base - h * 0.6).toFixed(1)}L${(x + w * 1.2).toFixed(1)} ${base}Z`;
  }
  return d;
}

function step(box, rolls) {
  const lip = box.y + box.h * rolls.between(0.0, 0.25);
  return rect(box.x, lip, box.w, box.y + box.h - lip);
}

const COMPONENTS = {
  crag, tower, skyline,
  pillar, arch, window: windowShape, wall, stair, gate, brazier, stall, chest,
  pillar_edge: pillarEdge, chain, banner, root,
  rubble, step,
};

/* ---------------------------------------------------------------- compose -- */

let SCENES = null;

function loadScenes(data) {
  SCENES = data;
}

function scaleRect(r) {
  return { x: r.x * W, y: r.y * H, w: r.w * W, h: r.h * H };
}

function svgEl(name, attrs) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, String(v)));
  return node;
}

/** Build the silhouette layers for one scene. Pure: same inputs, same DOM. */
function composeScene({ scene, biome, modifier, rolls }) {
  const spec = SCENES.scenes[scene];
  if (!spec) return null;
  const biomeSpec = SCENES.biomes[biome] || SCENES.biomes.understone;
  const mod = modifier ? SCENES.modifiers[modifier] : null;
  const cursor = new Rolls(rolls);
  const safe = (spec.safe || []).map(scaleRect);
  const deltas = Object.fromEntries(SCENES.layers.map((l) => [l.id, l.max_delta]));

  const grammar = JSON.parse(JSON.stringify(spec.grammar));
  if (mod && mod.extra) {
    Object.entries(mod.extra).forEach(([layer, entries]) => {
      grammar[layer] = (grammar[layer] || []).concat(entries);
    });
  }
  const suppressed = new Set((mod && mod.suppress) || []);
  const built = [];

  SCENES.layers
    .filter((layer) => layer.kind === 'silhouette' && spec.layers.includes(layer.id))
    .forEach((layer) => {
      const entries = grammar[layer.id] || [];
      if (!entries.length || suppressed.has(layer.id)) return;

      // One SVG per layer, not one per scene. The stack interleaves — haze sits
      // between far and mid, the light shaft between mid and near — and CSS
      // gradients cannot be siblings of SVG groups. mountScene() does the
      // weaving; this only has to keep the layers separable.
      const group = svgEl('svg', {
        viewBox: `0 0 ${W} ${H}`,
        preserveAspectRatio: 'xMidYMid slice',
        'aria-hidden': 'true',
        focusable: 'false',
        class: `scene-svg scene-layer-${layer.id}`,
      });
      entries.forEach((entry) => {
        // Fixed slice: reserve this entry's budget before drawing anything, so
        // one entry can never shift the dice of the next.
        const slice = 2 + 3 * entry.count[1];
        const mark = cursor.i + slice;

        const appears = cursor.take();
        const [low, high] = entry.count;
        const count = cursor.intBetween(low, high);
        if (count > 0 && (entry.weight === undefined || appears <= entry.weight)) {
          const zone = spec.zones[entry.zone] || SCENES.bands[entry.zone];
          const box = scaleRect(zone);
          const builder = COMPONENTS[entry.component];
          for (let i = 0; i < count; i += 1) {
            // Each instance gets its own slot across the zone, so repeats read as
            // a colonnade rather than a pile.
            const slot = count === 1 ? box : {
              x: box.x + (box.w * i) / count,
              y: box.y,
              w: box.w / count,
              h: box.h,
            };
            const scaled = mod && mod.scale
              ? { ...slot, y: slot.y - slot.h * (mod.scale - 1) * 0.5, h: slot.h * mod.scale }
              : slot;
            const d = builder(scaled, cursor, biomeSpec);
            if (!d) continue;
            group.appendChild(svgEl('path', {
              d,
              'fill-rule': 'evenodd',
              fill: fillFor(deltas[layer.id], behindTextFraction(scaled, safe)),
            }));
          }
        }
        cursor.advanceTo(mark);
      });
      if (group.childNodes.length) built.push({ id: layer.id, node: group });
    });

  return { layers: built, spec, biome: biomeSpec, modifier: mod };
}

/* Weave the composed silhouette into a host that already holds the atmosphere
 * elements, in the order content/scenes.json declares.
 *
 * The rule is one line: a silhouette layer goes immediately before the first
 * atmosphere element declared after it. That is what makes the stack real rather
 * than decorative — fog genuinely sits between the distance and the architecture,
 * and the light shaft genuinely falls behind the foreground. It lives here, and
 * not at each call site, so the gallery and the client cannot stack the same
 * scene two different ways. */
function mountScene(host, composed) {
  host.querySelectorAll('.scene-svg').forEach((node) => node.remove());
  if (!composed) return;
  const order = SCENES.layers.map((l) => l.id);
  composed.layers.forEach(({ id, node }) => {
    const after = order.slice(order.indexOf(id) + 1)
      .map((next) => host.querySelector(`.sc-${next}`))
      .find(Boolean);
    host.insertBefore(node, after || null);
  });
}

/* Atmosphere is CSS, not SVG: gradients belong in the stylesheet where the theme
   tokens live, and a gradient does not need geometry. The composer only tells the
   stylesheet where the light is and how far it reaches. */
function applyAtmosphere(host, { scene, biome, modifier }) {
  const spec = SCENES.scenes[scene];
  if (!spec) return;
  const biomeSpec = SCENES.biomes[biome] || SCENES.biomes.understone;
  const mod = modifier ? SCENES.modifiers[modifier] : null;
  const light = spec.light;

  host.style.setProperty('--sc-light-x', `${(light.x * 100).toFixed(1)}%`);
  host.style.setProperty('--sc-light-y', `${(light.y * 100).toFixed(1)}%`);
  host.style.setProperty('--sc-light-spread', String(light.spread * (mod ? mod.light || 1 : 1)));
  host.style.setProperty('--sc-tint', `var(${biomeSpec.tint})`);
  host.style.setProperty('--sc-tint-pct', `${biomeSpec.tint_pct}%`);
  host.dataset.scene = scene;
  host.dataset.biome = biome;
  const layers = new Set(spec.layers);
  ['void', 'haze', 'shaft', 'glow', 'vignette'].forEach((layer) => {
    host.classList.toggle(`has-${layer}`, layers.has(layer));
  });
}

/** Which scene a screen is standing in. */
function sceneFor(screen, room) {
  // The room's kind refines the room screen and only the room screen. The deck
  // and badges views are not places you are standing in, so an open room must
  // not leak its scene into them.
  if (screen === 'room' && room) {
    const byKind = SCENES.screens[`room.${room.kind}`] || SCENES.screens[room.kind];
    if (byKind) return byKind;
  }
  return SCENES.screens[screen] || SCENES.screens.map;
}

function biomeForAct(act) {
  const entries = Object.entries(SCENES.biomes).filter(([k]) => k !== '_comment');
  const exact = entries.find(([, b]) => b.act === act);
  if (exact) return exact[0];
  // The climb is unbounded; everything past the last named act is the endless one.
  return entries[entries.length - 1][0];
}

const SCENE_FRAME = { W, H };


/* ---- app.js ---- */
/* Spire — the client.
 *
 * Renders whatever the engine last said and calls tools when the player acts.
 * It holds no rules: legality, energy, progress, unknown-node resolution and the
 * single-room lock all live in scripts/run.py, because two implementations of
 * the rules would drift and the Python one is the one with property tests.
 *
 * Screen order and hero regions come from design/spire-ai/ui/formats/*.md, which
 * treat layout regions as an API. The two rules those docs care most about are
 * enforced here in code rather than left to taste:
 *   - the intent is shown before the hand is usable
 *   - Skip owns the reward hero region and takes focus on entry
 */



const SOFT_CAP_WARN = 'Deck is at the soft cap — taking a card means trading one away.';

/* Slay the Spire 2's intent vocabulary. `shows` decides whether a number is
   printed: an attack prints its exact tier, a block prints nothing at all. The
   middle option — a bracketed range — is the one Mega Crit playtested and cut,
   because players could not tell randomness from ignorance and stalled. */
const INTENT_ICONS = {
  attack: { icon: '⚔', tone: 'danger', shows: true },
  defend: { icon: '⛨', tone: 'muted', shows: false },
  buff: { icon: '↑', tone: 'warn', shows: false },
  debuff: { icon: '↓', tone: 'danger', shows: false },
  status: { icon: '⬚', tone: 'warn', shows: true },
  affliction: { icon: '▧', tone: 'warn', shows: true },
  heal: { icon: '+', tone: 'safe', shows: false },
  summon: { icon: '◉', tone: 'danger', shows: true },
  deathblow: { icon: '☠', tone: 'danger', shows: false },
  cowardly: { icon: '↷', tone: 'muted', shows: false },
  stunned: { icon: '✳', tone: 'muted', shows: false },
  sleeping: { icon: 'z', tone: 'muted', shows: true },
  unknown: { icon: '?', tone: 'muted', shows: false },
};

const NODE_GLYPH = {
  monster: '✦', elite: '✸', rest: '▲', shop: '◆',
  treasure: '▮', boss: '☠', event: '◇', unknown: '?',
};

const NODE_LABEL = {
  monster: 'Monster room', elite: 'Elite room', rest: 'Campfire', shop: 'Merchant',
  treasure: 'Chest', boss: 'Act boss', event: 'Event', unknown: 'Unknown node',
};

const FACETS = {
  title: 'title', map: 'map', room: 'combat', event: 'event',
  reward: 'reward', campfire: 'campfire', shop: 'shop', deck: 'deck', badges: 'title',
};

/* Markers the map draw tool offers. Slay the Spire 2 shipped annotation because
   routing is the decision the map exists to support; community sticker mods
   converged on roughly this set. */
const MARKERS = ['★', '✕', '☠', '❓', '👁'];

/* content/scenes.json, inlined by tools/build-app.mjs. Reading it through a
   guard rather than importing it means loading app/ unbundled — which nothing
   ships, but which is how you would poke at one file — leaves the background
   empty instead of throwing. */
const SCENE_DATA = typeof SPIRE_SCENES === 'undefined' ? null : SPIRE_SCENES;
if (SCENE_DATA) loadScenes(SCENE_DATA);

const bridge = new Bridge({ name: 'Spire', version: '0.3.0' });

const ui = {
  state: null,
  map: null,
  screen: 'title',
  selected: null,
  marker: null,
  handRevealed: false,
  busy: false,
  lastError: null,
};

/* ------------------------------------------------------------------ util -- */

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

function toast(message) {
  const existing = $('#toast');
  if (existing) existing.remove();
  const node = el('div', 'toast', message);
  node.id = 'toast';
  node.setAttribute('role', 'status');
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 2600);
}

function fanfare(text) {
  const overlay = el('div', 'fanfare');
  overlay.appendChild(el('div', 'stamp', text));
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 660);
}

/* Facet tint and background are one gesture, because they answer one question:
   where am I. Splitting them let the tint change while the room stayed the same
   picture, which read as a filter rather than a move. */
function setScene(name) {
  document.documentElement.style.setProperty('--facet', `var(--facet-${FACETS[name] || 'map'})`);
  paintScene(name);
}

/* Compose the background for a screen.
 *
 * The dice come from the engine — `map.scene_rolls`, one vector per scene, fixed
 * for a seed and an act — so re-entering a floor is not merely similar to last
 * time, it is the same picture. Before a run exists there are no dice at all and
 * the composer falls back to its midpoints, which is the right answer for the
 * title screen: a symmetric gate, drawn the same for everyone. */
function paintScene(screen) {
  const host = $('#scene');
  if (!host || !SCENE_DATA) return;

  const { scene, modifier } = sceneFor(screen, ui.state && ui.state.room);
  const act = (ui.state && ui.state.act) || (ui.map && ui.map.act) || 1;
  const biome = biomeForAct(act);
  const rolls = (ui.map && ui.map.scene_rolls && ui.map.scene_rolls[scene]) || null;

  // Recomposing costs a few hundred path builds, and render() fires on every
  // card played. Redraw only when the place actually changed.
  const key = `${scene}|${biome}|${modifier || ''}|${rolls ? rolls.length : 0}`;
  if (host.dataset.key === key) return;
  host.dataset.key = key;

  applyAtmosphere(host, { scene, biome, modifier });
  mountScene(host, composeScene({ scene, biome, modifier, rolls }));
}

/* ---------------------------------------------------------------- engine -- */

async function callTool(name, args) {
  if (ui.busy) return null;
  ui.busy = true;
  try {
    const result = await bridge.callServerTool(name, args || {});
    const payload = unwrap(result);
    if (payload && payload.ok === false) {
      ui.lastError = payload.error;
      toast(payload.error.message || 'Refused.');
    } else {
      ui.lastError = null;
    }
    absorb(payload);
    return payload;
  } catch (err) {
    toast(String(err && err.message ? err.message : err));
    return null;
  } finally {
    ui.busy = false;
  }
}

/* Fold whatever came back into the client's view of the world. */
function absorb(payload) {
  if (!payload) return;
  if (payload.state) ui.state = payload.state;
  if (payload.map) ui.map = payload.map;
  if (payload.room && ui.state) ui.state.room = payload.room;
  if (payload.hand && ui.state) ui.state.hand = payload.hand;
  if (payload.wares) ui.wares = payload.wares;
  if (payload.badges) ui.badges = payload.badges;
  if (payload.annotations && ui.map) {
    ui.map.nodes.forEach((n) => { n.mark = payload.annotations[n.id] || null; });
  }
  route();
  render();
}

/* Which screen the state implies. The client never picks a screen the state does
   not justify — that is how the single-room lock stays true in the UX and not
   just in the data. */
function route() {
  const s = ui.state;
  if (!s) { ui.screen = 'title'; return; }
  if (s.room) {
    ui.screen = s.room.kind === 'event' ? 'event'
      : s.room.kind === 'rest' ? 'campfire'
        : s.room.kind === 'shop' ? 'shop' : 'room';
    return;
  }
  if (s.pending_reward) { ui.screen = 'reward'; return; }
  if (ui.screen === 'badges' || ui.screen === 'deck') return;
  ui.screen = 'map';
}

/* ---------------------------------------------------------------- chrome -- */

function renderChrome() {
  const s = ui.state;
  const bar = $('#chrome');
  const banner = $('#banner');
  bar.innerHTML = '';
  banner.hidden = true;
  if (!s) { bar.hidden = true; return; }
  bar.hidden = false;

  const add = (label, value, cls) => {
    const wrap = el('span', cls || '');
    wrap.append(document.createTextNode(`${label} `));
    wrap.appendChild(el('b', null, String(value)));
    bar.appendChild(wrap);
  };

  bar.appendChild(el('span', 'chip cls', s.class_name || 'Colorless'));
  add('Act', (s.act_label || '').replace(/^Act\s*/, ''));
  add('Floor', s.floor);

  const deck = el('span', s.over_soft_cap ? 'chip cap-warn' : '');
  deck.append(document.createTextNode('Deck '));
  deck.appendChild(el('b', null, `${s.deck_size}/${s.soft_cap}`));
  bar.appendChild(deck);

  add('Focus', `◈${s.focus}`);
  add('Streak', s.streak);
  add('Ascension', `A${s.ascension}`);

  if (s.room && s.room.energy !== undefined) {
    const wrap = el('span');
    wrap.append(document.createTextNode('Energy '));
    wrap.appendChild(pips(s.room.energy, s.room.energy_max));
    bar.appendChild(wrap);
  }

  (s.relics || []).slice(0, 6).forEach((relic) => {
    const chip = el('span', 'sil relic');
    chip.title = `${relic.name} — ${relic.rule}`;
    chip.setAttribute('aria-label', `Relic: ${relic.name}`);
    bar.appendChild(chip);
  });
  (s.potions || []).filter(Boolean).forEach((potion) => {
    const chip = el('span', 'sil potion');
    chip.title = `${potion.name} — ${potion.spent_on}`;
    chip.setAttribute('aria-label', `Potion: ${potion.name}`);
    bar.appendChild(chip);
  });

  if (s.room) {
    banner.hidden = false;
    banner.innerHTML = '';
    banner.appendChild(el('span', 'dot', '●'));
    banner.appendChild(el('span', null,
      `ROOM ACTIVE: ${s.room.name} · ${s.room.room_type || s.room.kind}`));
    const spacer = el('span', 'spacer');
    banner.appendChild(spacer);
    if (ui.screen !== 'map') {
      const flee = el('button', 'btn ghost', 'Flee');
      flee.dataset.action = 'flee';
      banner.appendChild(flee);
    }
  }
}

function pips(now, max) {
  const wrap = el('span', 'pips');
  wrap.setAttribute('role', 'img');
  wrap.setAttribute('aria-label', `${now} of ${max} energy`);
  for (let i = 0; i < Math.max(now, max); i += 1) {
    wrap.appendChild(el('span', i < now ? 'pip on' : 'pip'));
  }
  return wrap;
}

/* ------------------------------------------------------------------ title -- */

function screenTitle() {
