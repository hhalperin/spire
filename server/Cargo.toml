[package]
name = "spire-mcp"
version = "0.3.0"
edition = "2021"
description = "Spire's MCP server: the roguelike UI for a codebase, as an MCP App."
license = "MIT"
build = "build.rs"

[[bin]]
name = "spire-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
anyhow = "1"
