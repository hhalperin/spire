<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spire</title>
  <meta name="description" content="Spire — your project is the run, your Claude config is the deck. One room at a time." />
  <!-- No external origins. Fonts are inlined by tools/build-app.mjs, which is
       what lets the ui:// resource declare an empty CSP allowlist. -->
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="wordmark">SPIRE</span>
      <span class="tagline">one room at a time</span>
      <div class="topbar-right">
        <button type="button" class="icon-btn" id="btn-theme" title="Switch theme">
          <span id="theme-label">Theme</span>
        </button>
      </div>
    </header>

    <div class="chrome" id="chrome" hidden></div>
    <div class="banner" id="banner" role="status" hidden></div>

    <main class="stage" id="stage" aria-live="polite"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
